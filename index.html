<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Car Distance-Time Graph</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Position of a Remote Controlled Car</h1>
  <p>Car moves towards and away from Emile while graph tracks distance and time.</p>

  <canvas id="graph" width="400" height="300"></canvas>

  <div id="road">
    <div id="emile">🧍‍♀️</div>
    <div id="car">🚕</div>
  </div>

  <div class="controls">
    <button id="playBtn">▶ Play</button>
    <button id="pauseBtn">⏸ Pause</button>
    <button id="resetBtn">⏹ Reset</button>
    <button id="newGraphBtn">🔄 New Graph</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
